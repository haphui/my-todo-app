<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>파일 탐색기 투두 매니저</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter and Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind Custom Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans KR"', 'Inter', 'sans-serif'],
          },
          colors: {
            winBg: '#f0f3f6',
            winPanel: '#ffffff',
            winBorder: '#d1d5db',
            winActiveTab: '#ffffff',
            winInactiveTab: '#e5e9f0',
            winBar: '#e2e7ec',
            winAccent: '#0067b8',
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar and subtle transitions */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #c5c7cb;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #a8abb0;
    }
    .folder-tab {
      position: relative;
      transition: all 0.15s ease-in-out;
    }
    .folder-tab.active {
      border-bottom-color: #ffffff !important;
      background-color: #ffffff;
      font-weight: 600;
      color: #0f172a;
    }
    .task-card-enter {
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-[#e9eef3] text-slate-800 font-sans min-h-screen p-3 sm:p-6 md:p-8 flex justify-center items-start antialiased selection:bg-blue-100">

  <!-- Windows Explorer Window Container -->
  <main class="w-full max-w-4xl bg-winPanel border border-[#bfc7d0] rounded-xl shadow-2xl overflow-hidden flex flex-col transition-all">
    
    <!-- Titlebar (Windows Inspired) -->
    <header class="bg-[#dfe6ed] border-b border-[#c8d1db] px-4 py-2.5 flex items-center justify-between select-none">
      <div class="flex items-center space-x-2">
        <!-- Explorer Folder Icon -->
        <span class="text-xl">📁</span>
        <h1 class="text-sm font-semibold text-slate-700 tracking-tight">작업 탐색기 - C:\Users\User\Tasks</h1>
      </div>
      <!-- Window Controls -->
      <div class="flex items-center space-x-2">
        <button type="button" aria-label="최소화" class="w-3.5 h-3.5 rounded-full bg-amber-400 hover:bg-amber-500 transition-colors shadow-sm focus:outline-none"></button>
        <button type="button" aria-label="최대화" class="w-3.5 h-3.5 rounded-full bg-emerald-400 hover:bg-emerald-500 transition-colors shadow-sm focus:outline-none"></button>
        <button type="button" aria-label="닫기" class="w-3.5 h-3.5 rounded-full bg-rose-400 hover:bg-rose-500 transition-colors shadow-sm focus:outline-none"></button>
      </div>
    </header>

    <!-- Navigation Breadcrumbs & Summary Toolbar -->
    <div class="bg-[#f7f9fa] border-b border-winBorder px-4 py-2 text-xs flex flex-wrap items-center justify-between gap-2 text-slate-600">
      <div class="flex items-center space-x-1.5 overflow-x-auto py-0.5">
        <span class="text-slate-400">경로:</span>
        <span class="font-medium text-blue-600 hover:underline cursor-pointer" onclick="switchCategory('전체')">내 할 일</span>
        <span class="text-slate-400">›</span>
        <span id="currentPathText" class="font-semibold text-slate-800 bg-white px-2 py-0.5 rounded border border-slate-200">전체</span>
      </div>
      <div class="flex items-center space-x-3 text-xs">
        <span id="statsPinned" class="flex items-center gap-1 font-medium text-amber-600">⭐ 고정: 0</span>
        <span class="text-slate-300">|</span>
        <span id="statsCompleted" class="flex items-center gap-1 font-medium text-emerald-600">✔️ 완료: 0/0</span>
      </div>
    </div>

    <!-- Folder Tabs (Windows Explorer Tabs) -->
    <nav aria-label="폴더 카테고리" class="bg-[#ebf0f5] border-b border-winBorder px-3 pt-2.5 flex items-center space-x-1.5 overflow-x-auto">
      <div id="categoryTabsContainer" class="flex items-center space-x-1.5">
        <!-- Dynamic tabs generated via JS -->
      </div>
      <!-- Add New Folder Button -->
      <button 
        id="btnOpenFolderModal" 
        type="button"
        title="새 카테고리 폴더 추가"
        class="flex items-center space-x-1 px-2.5 py-1.5 text-xs text-slate-600 hover:text-blue-600 hover:bg-white/70 rounded-md transition-all font-medium border border-transparent hover:border-slate-300 shrink-0"
      >
        <span class="text-base font-bold leading-none">+</span>
        <span>새 폴더</span>
      </button>
    </nav>

    <!-- Task Creation Form Section -->
    <section class="p-4 sm:p-5 bg-white border-b border-slate-200">
      <form id="taskForm" class="flex flex-col sm:flex-row gap-2.5 items-stretch sm:items-center">
        <!-- Folder Category Selector -->
        <div class="relative sm:w-44 shrink-0">
          <label for="taskCategorySelect" class="sr-only">폴더 선택</label>
          <select 
            id="taskCategorySelect" 
            class="w-full pl-3 pr-7 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-xs sm:text-sm font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none appearance-none cursor-pointer hover:bg-slate-100 transition-colors"
          >
            <!-- Options populated dynamically -->
          </select>
          <div class="absolute inset-y-0 right-0 pr-2.5 flex items-center pointer-events-none text-slate-400 text-xs">
            ▼
          </div>
        </div>

        <!-- Task Input Field -->
        <div class="relative flex-grow">
          <label for="taskInput" class="sr-only">할 일 내용</label>
          <input 
            type="text" 
            id="taskInput" 
            maxlength="100" 
            placeholder="어떤 할 일을 기록할까요? (Enter를 눌러 등록)" 
            class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg text-sm placeholder:text-slate-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition-all shadow-sm"
            required
          >
        </div>

        <!-- Add Button -->
        <button 
          type="submit" 
          class="bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white px-5 py-2.5 rounded-lg text-sm font-semibold tracking-wide shadow-sm hover:shadow transition-all flex items-center justify-center space-x-1 shrink-0"
        >
          <span>추가</span>
          <span>➕</span>
        </button>
      </form>
    </section>

    <!-- Task List Area -->
    <section class="flex-grow p-4 sm:p-6 bg-[#fafbfc] min-h-[360px]">
      <div class="flex items-center justify-between mb-3 px-1">
        <h2 id="currentCategoryHeading" class="text-xs uppercase font-bold text-slate-500 tracking-wider">
          전체 목록
        </h2>
        <span id="filteredCountBadge" class="text-xs bg-slate-200 text-slate-700 font-semibold px-2 py-0.5 rounded-full">
          0개
        </span>
      </div>

      <!-- Task Items List -->
      <ul id="taskList" class="space-y-2.5">
        <!-- Rendered dynamically -->
      </ul>

      <!-- Empty State -->
      <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center text-slate-400">
        <span class="text-5xl mb-2.5">📂</span>
        <p class="text-base font-medium text-slate-600">폴더가 비어 있습니다.</p>
        <p class="text-xs text-slate-400 mt-1">상단의 입력창에서 새로운 작업을 추가해 보세요.</p>
      </div>
    </section>

    <!-- Bottom Status Bar -->
    <footer class="bg-[#edf2f7] border-t border-slate-200 px-4 py-2 text-xs text-slate-500 flex flex-col sm:flex-row justify-between items-center gap-2">
      <div class="flex items-center space-x-2">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
        <span>브라우저 저장소 동기화 중 (자동 저장)</span>
      </div>
      <div>
        <span class="font-medium text-slate-600">Tip:</span> ⭐ 버튼을 클릭하면 최상단에 고정됩니다.
      </div>
    </footer>

  </main>

  <!-- New Folder Modal Dialog -->
  <div id="folderModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50 transition-opacity">
    <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-5 border border-slate-200 transform transition-transform">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div class="flex items-center space-x-2 font-bold text-slate-800 text-base">
          <span>📁</span>
          <span>새 폴더(카테고리) 생성</span>
        </div>
        <button id="btnCloseFolderModal" class="text-slate-400 hover:text-slate-600 text-lg leading-none">&times;</button>
      </div>
      <form id="folderForm" class="mt-4">
        <label for="newFolderNameInput" class="block text-xs font-semibold text-slate-600 mb-1">
          폴더 이름
        </label>
        <input 
          type="text" 
          id="newFolderNameInput" 
          maxlength="20"
          placeholder="예: 프로젝트, 쇼핑, 운동" 
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none mb-4"
          required
        >
        <div class="flex justify-end space-x-2">
          <button 
            type="button" 
            id="btnCancelFolder" 
            class="px-4 py-2 rounded-lg text-xs font-medium text-slate-600 hover:bg-slate-100 transition-colors"
          >
            취소
          </button>
          <button 
            type="submit" 
            class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium transition-colors"
          >
            만들기
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Initial categories and storage keys
    const STORAGE_KEY_TASKS = 'vibe_win_tasks_v1';
    const STORAGE_KEY_CATEGORIES = 'vibe_win_categories_v1';

    const defaultCategories = ['업무', '개인', '공부'];
    const defaultTasks = [
      {
        id: '1',
        title: '윈도우 탐색기 디자인 마무리하기',
        category: '업무',
        completed: false,
        pinned: true,
        createdAt: Date.now() - 3600000 * 2
      },
      {
        id: '2',
        title: '바이브 코딩 프로젝트 복습',
        category: '공부',
        completed: false,
        pinned: false,
        createdAt: Date.now() - 3600000
      },
      {
        id: '3',
        title: '책상 정리 및 서류 스캔',
        category: '개인',
        completed: true,
        pinned: false,
        createdAt: Date.now()
      }
    ];

    // Reactive State
    let categories = [];
    let tasks = [];
    let currentCategory = '전체';

    // DOM Elements
    const categoryTabsContainer = document.getElementById('categoryTabsContainer');
    const taskCategorySelect = document.getElementById('taskCategorySelect');
    const taskList = document.getElementById('taskList');
    const emptyState = document.getElementById('emptyState');
    const taskForm = document.getElementById('taskForm');
    const taskInput = document.getElementById('taskInput');
    const currentPathText = document.getElementById('currentPathText');
    const currentCategoryHeading = document.getElementById('currentCategoryHeading');
    const filteredCountBadge = document.getElementById('filteredCountBadge');
    const statsPinned = document.getElementById('statsPinned');
    const statsCompleted = document.getElementById('statsCompleted');

    // Folder Modal Elements
    const folderModal = document.getElementById('folderModal');
    const btnOpenFolderModal = document.getElementById('btnOpenFolderModal');
    const btnCloseFolderModal = document.getElementById('btnCloseFolderModal');
    const btnCancelFolder = document.getElementById('btnCancelFolder');
    const folderForm = document.getElementById('folderForm');
    const newFolderNameInput = document.getElementById('newFolderNameInput');

    function loadState() {
      try {
        const storedCats = localStorage.getItem(STORAGE_KEY_CATEGORIES);
        categories = storedCats ? JSON.parse(storedCats) : defaultCategories;

        const storedTasks = localStorage.getItem(STORAGE_KEY_TASKS);
        tasks = storedTasks ? JSON.parse(storedTasks) : defaultTasks;
      } catch (err) {
        console.error('Failed to load local storage:', err);
        categories = [...defaultCategories];
        tasks = [...defaultTasks];
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY_CATEGORIES, JSON.stringify(categories));
        localStorage.setItem(STORAGE_KEY_TASKS, JSON.stringify(tasks));
      } catch (err) {
        console.error('Failed to save to local storage:', err);
      }
      updateStats();
    }

    function renderCategoryTabs() {
      categoryTabsContainer.innerHTML = '';

      // All ('전체') Tab
      const allTabs = ['전체', ...categories];

      allTabs.forEach(cat => {
        const isActive = currentCategory === cat;
        const tabBtn = document.createElement('button');
        tabBtn.type = 'button';
        tabBtn.className = `folder-tab flex items-center space-x-1.5 px-3 py-2 text-xs rounded-t-lg border-t border-x border-b-0 cursor-pointer select-none shrink-0 ${
          isActive 
            ? 'active bg-white border-slate-300 text-blue-700 shadow-sm' 
            : 'bg-[#dfe4eb] hover:bg-[#e6ebf2] border-slate-300/80 text-slate-600'
        }`;

        const icon = cat === '전체' ? '🗂️' : '📁';
        tabBtn.innerHTML = `
          <span>${icon}</span>
          <span class="tracking-tight">${escapeHtml(cat)}</span>
        `;

        tabBtn.addEventListener('click', () => switchCategory(cat));
        categoryTabsContainer.appendChild(tabBtn);
      });

      // Update dropdown in Task Form
      taskCategorySelect.innerHTML = '';
      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = `📁 ${cat}`;
        if (currentCategory === cat) {
          option.selected = true;
        }
        taskCategorySelect.appendChild(option);
      });
    }

    function switchCategory(catName) {
      currentCategory = catName;
      currentPathText.textContent = catName;
      currentCategoryHeading.textContent = catName === '전체' ? '전체 작업 목록' : `${catName} 폴더의 작업`;
      renderCategoryTabs();
      renderTasks();
    }

    function getFilteredAndSortedTasks() {
      // 1. Filter by category
      let filtered = tasks;
      if (currentCategory !== '전체') {
        filtered = tasks.filter(t => t.category === currentCategory);
      }

      // 2. Sort: Pinned first (⭐), then unpinned. Within the same pinned state, newest created first
      return [...filtered].sort((a, b) => {
        if (a.pinned !== b.pinned) {
          return a.pinned ? -1 : 1; // Pinned floats to top
        }
        return b.createdAt - a.createdAt; // Newer tasks higher
      });
    }

    function renderTasks() {
      const visibleTasks = getFilteredAndSortedTasks();
      filteredCountBadge.textContent = `${visibleTasks.length}개`;
      taskList.innerHTML = '';

      if (visibleTasks.length === 0) {
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
      } else {
        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');
      }

      visibleTasks.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-card-enter group flex items-center justify-between p-3 sm:px-4 sm:py-3.5 bg-white rounded-lg border transition-all hover:shadow-md ${
          task.pinned 
            ? 'border-amber-300/80 bg-amber-50/40 ring-1 ring-amber-200' 
            : 'border-slate-200 hover:border-slate-300'
        } ${task.completed ? 'opacity-65 bg-slate-50' : ''}`;

        // Left section: Checkbox & content
        const leftWrap = document.createElement('div');
        leftWrap.className = 'flex items-center space-x-3 min-w-0 pr-2';

        // Checkbox (Task Completion)
        const checkBtn = document.createElement('button');
        checkBtn.type = 'button';
        checkBtn.setAttribute('aria-label', task.completed ? '미완료로 변경' : '완료로 표시');
        checkBtn.className = `w-5 h-5 rounded flex items-center justify-center border transition-all shrink-0 ${
          task.completed 
            ? 'bg-emerald-500 border-emerald-600 text-white font-bold text-xs' 
            : 'bg-white border-slate-300 hover:border-blue-500 text-transparent'
        }`;
        checkBtn.innerHTML = task.completed ? '✓' : '';
        checkBtn.addEventListener('click', () => toggleTaskCompletion(task.id));

        // Text & Badge container
        const textContainer = document.createElement('div');
        textContainer.className = 'flex flex-col min-w-0';

        const titleSpan = document.createElement('span');
        titleSpan.className = `text-sm font-medium text-slate-800 break-words ${
          task.completed ? 'line-through text-slate-400 font-normal' : ''
        }`;
        titleSpan.textContent = task.title;

        // Meta tags (Folder badge + Pinned tag)
        const metaDiv = document.createElement('div');
        metaDiv.className = 'flex items-center gap-1.5 mt-0.5 text-[11px] text-slate-500';
        metaDiv.innerHTML = `
          <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 font-normal border border-slate-200">
            📁 ${escapeHtml(task.category)}
          </span>
          ${task.pinned ? '<span class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded bg-amber-100 text-amber-800 font-semibold border border-amber-200">📌 고정됨</span>' : ''}
        `;

        textContainer.appendChild(titleSpan);
        textContainer.appendChild(metaDiv);

        leftWrap.appendChild(checkBtn);
        leftWrap.appendChild(textContainer);

        // Right section: Star toggle & Delete buttons
        const rightWrap = document.createElement('div');
        rightWrap.className = 'flex items-center space-x-1 shrink-0';

        // Star Toggle (Pin feature)
        const starBtn = document.createElement('button');
        starBtn.type = 'button';
        starBtn.title = task.pinned ? '상단 고정 해제' : '상단에 고정';
        starBtn.className = `p-1.5 rounded-md text-base transition-transform active:scale-125 focus:outline-none ${
          task.pinned 
            ? 'text-amber-500 hover:text-amber-600' 
            : 'text-slate-300 hover:text-amber-400'
        }`;
        starBtn.innerHTML = task.pinned ? '⭐' : '☆';
        starBtn.addEventListener('click', () => toggleTaskPin(task.id));

        // Delete button
        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.title = '할 일 삭제';
        deleteBtn.className = 'p-1.5 rounded-md text-slate-400 hover:text-rose-600 hover:bg-rose-50 text-sm transition-colors focus:outline-none';
        deleteBtn.innerHTML = '🗑️';
        deleteBtn.addEventListener('click', () => deleteTask(task.id));

        rightWrap.appendChild(starBtn);
        rightWrap.appendChild(deleteBtn);

        li.appendChild(leftWrap);
        li.appendChild(rightWrap);

        taskList.appendChild(li);
      });

      updateStats();
    }

    function addTask(title, category) {
      if (!title.trim()) return;

      const newTask = {
        id: Date.now().toString() + Math.random().toString(36).substring(2, 6),
        title: title.trim(),
        category: category || (categories[0] || '업무'),
        completed: false,
        pinned: false,
        createdAt: Date.now()
      };

      tasks.unshift(newTask);
      saveState();
      renderTasks();
    }

    function toggleTaskCompletion(taskId) {
      const task = tasks.find(t => t.id === taskId);
      if (task) {
        task.completed = !task.completed;
        saveState();
        renderTasks();
      }
    }

    function toggleTaskPin(taskId) {
      const task = tasks.find(t => t.id === taskId);
      if (task) {
        task.pinned = !task.pinned;
        saveState();
        renderTasks();
      }
    }

    function deleteTask(taskId) {
      tasks = tasks.filter(t => t.id !== taskId);
      saveState();
      renderTasks();
    }

    function updateStats() {
      const pinnedCount = tasks.filter(t => t.pinned).length;
      const completedCount = tasks.filter(t => t.completed).length;
      const totalCount = tasks.length;

      statsPinned.textContent = `⭐ 고정: ${pinnedCount}`;
      statsCompleted.textContent = `✔️ 완료: ${completedCount}/${totalCount}`;
    }

    function createCategory(name) {
      const trimmed = name.trim();
      if (!trimmed || trimmed === '전체' || categories.includes(trimmed)) {
        return;
      }
      categories.push(trimmed);
      saveState();
      switchCategory(trimmed);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Add task form submission
    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = taskInput.value.trim();
      const selectedCat = taskCategorySelect.value;
      if (val) {
        addTask(val, selectedCat);
        taskInput.value = '';
        taskInput.focus();
      }
    });

    // Folder Modal toggle
    btnOpenFolderModal.addEventListener('click', () => {
      folderModal.classList.remove('hidden');
      folderModal.classList.add('flex');
      newFolderNameInput.value = '';
      setTimeout(() => newFolderNameInput.focus(), 100);
    });

    function closeFolderModal() {
      folderModal.classList.add('hidden');
      folderModal.classList.remove('flex');
    }

    btnCloseFolderModal.addEventListener('click', closeFolderModal);
    btnCancelFolder.addEventListener('click', closeFolderModal);

    folderForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const folderName = newFolderNameInput.value.trim();
      if (folderName) {
        createCategory(folderName);
        closeFolderModal();
      }
    });

    // Close modal on click outside
    folderModal.addEventListener('click', (e) => {
      if (e.target === folderModal) {
        closeFolderModal();
      }
    });

    // Initial boot on load
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderCategoryTabs();
      renderTasks();
    });
  </script>
</body>
</html>
